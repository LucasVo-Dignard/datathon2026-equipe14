[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata"
version = "0.1.0"
description = "Market data fetchers (Yahoo Finance, Finnhub) for the BNCD info tool"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pandas>=2.0",
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# db/migrate.py (runs Flyway on RDS through SSM)
ops = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
